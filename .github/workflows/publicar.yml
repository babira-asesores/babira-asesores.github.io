name: Actualizar y publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  catalogo:
    runs-on: ubuntu-latest
    outputs:
      firebase: ${{ steps.fb.outputs.listo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar catálogo desde inventario.csv y fotos
        run: python herramientas/generar.py
      - name: Guardar catálogo actualizado
        run: |
          if ! git diff --quiet datos/propiedades.js functions/propiedades.json; then
            git config user.name "babira-bot"
            git config user.email "bot@users.noreply.github.com"
            git add datos/propiedades.js functions/propiedades.json
            git commit -m "Catálogo actualizado automáticamente [skip ci]"
            git push
          fi
      - id: fb
        run: echo "listo=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: .
          include-hidden-files: true

  # Con Firebase conectado: sitio + funciones (IA, pagos, bots) + reglas
  firebase:
    needs: catalogo
    if: needs.catalogo.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix functions --omit=dev
      - name: Desplegar en Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting,functions,firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --force

  # Sin Firebase todavía: catálogo estático en GitHub Pages
  pages:
    needs: catalogo
    if: needs.catalogo.outputs.firebase != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
