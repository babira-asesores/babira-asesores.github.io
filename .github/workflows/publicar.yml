name: Actualizar y publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar catálogo desde inventario.csv y fotos
        run: python herramientas/generar.py
      - name: Guardar catálogo actualizado
        run: |
          if ! git diff --quiet datos/propiedades.js; then
            git config user.name "babira-bot"
            git config user.email "bot@users.noreply.github.com"
            git add datos/propiedades.js
            git commit -m "Catálogo actualizado automáticamente [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
